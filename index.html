<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lottery Dashboard</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif; background:#071426;color:#e6eef8;padding:20px}
    .card{background:#0b2236;padding:12px;border-radius:10px;margin-bottom:12px}
    h1{margin:0 0 8px}
    pre{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="card">
    <h1>Lottery History</h1>
    <div id="content">Loading…</div>
  </div>

  <script>
    const rawUrl = location.origin + location.pathname.replace(/index\\.html$/,'') + 'results.json';
    // try raw.githubusercontent fallback
    async function load() {
      try {
        const resp = await fetch(rawUrl);
        if (!resp.ok) {
          // try raw.githubusercontent url (repo raw): user must replace below if needed
          document.getElementById('content').innerText = 'Enable GitHub Pages or ensure results.json exists in repo root.';
          return;
        }
        const data = await resp.json();
        render(data);
      } catch (e) {
        document.getElementById('content').innerText = 'Error loading results.json: ' + e.message;
      }
    }
    function render(data) {
      if(!data.rounds || data.rounds.length===0) {
        document.getElementById('content').innerText = 'No rounds yet.';
        return;
      }
      let html = '';
      data.rounds.slice().reverse().forEach((r, i) => {
        html += '<div style="margin-bottom:12px">';
        html += '<strong>Round @ ' + (new Date(r.timestamp*1000)).toLocaleString() + '</strong><br/>';
        html += 'Players: ' + r.playersCount + '<br/>';
        html += 'Winners: ' + (r.winners ? r.winners.join(', ') : 'N/A') + '<br/>';
        if(r.transferSignatures) {
          html += 'Tx: ' + (r.transferSignatures.winner1||'') + ' , ' + (r.transferSignatures.winner2||'') + '<br/>';
        }
        html += '</div>';
      });
      document.getElementById('content').innerHTML = html;
    }
    load();
  </script>
</body>
</html>
