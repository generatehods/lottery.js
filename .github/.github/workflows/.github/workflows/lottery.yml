name: Lottery job
on:
  schedule:
    - cron: '0 */3 * * *'   # jalan setiap 3 jam (UTC)
  workflow_dispatch: {}      # bisa run manual

jobs:
  run-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run lottery script
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FEE_ADDRESS: ${{ secrets.FEE_ADDRESS }}
        run: node lottery.js

      - name: Push results
        if: always()
        run: echo "Lottery run finished."
